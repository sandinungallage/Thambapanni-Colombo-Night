<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery | Thambapanni Colombo Night</title>
<meta name="description" content="Photo albums from Phase 1 of Thambapanni Colombo Night. Photography by Dreamlense.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italiana&family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="gallery">
<div id="site-header"></div>

<main class="page">
  <header class="page-head wrap">
    <p class="eyebrow">Photography by Dreamlense</p>
    <h1>Gallery</h1>
    <p class="lede">Photo albums from Phase 1.</p>
    <div class="orn"><i></i></div>
  </header>
  <div class="wrap section" id="gallery-root"></div>
</main>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <button class="lb-btn lb-close" id="lb-x" type="button" aria-label="Close">&times;</button>
  <div class="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-bar">
    <button class="lb-btn" id="lb-prev" type="button" aria-label="Previous photo">&lsaquo;</button>
    <span id="lb-cap"></span>
    <button class="lb-btn" id="lb-next" type="button" aria-label="Next photo">&rsaquo;</button>
  </div>
</div>

<div id="site-footer"></div>
<script src="site.js"></script>
<script>
/* Photo albums. A photo is { src, alt }. A null entry shows a placeholder slot.
   To replace a slot, swap null for { src: 'img/your-photo.jpg', alt: 'what is in the photo' }. */
const P = (src, alt) => ({ src, alt });
const slots = (n, real) => Array.from({ length: n }, (_, i) => real[i] || null);
const ALBUMS = [
  { id: 'courtyard', title: 'The Courtyard', blurb: 'Tables, string lights and the crowd.',
    photos: slots(8, [P('img/crowd.jpg', 'Crowd at long tables in the courtyard')]) },
  { id: 'heritage', title: 'Heritage Moves', blurb: 'Masks, fire and traditional costume.',
    photos: slots(8, [P('img/fire.jpg', 'Masked dancer with sparks'), P('img/mask.jpg', 'Dancers with a carved cobra mask')]) },
  { id: 'stage', title: 'Main Stage', blurb: 'The band under the trees.',
    photos: slots(8, [P('img/stage.jpg', 'Band on the main stage')]) },
  { id: '2forty2', title: '2forty2 Live', blurb: 'The headline set.', photos: slots(8, []) },
  { id: 'artists', title: 'Artist Moments', blurb: 'On stage and backstage.', photos: slots(8, []) },
  { id: 'bts', title: 'Behind the Scenes', blurb: 'Setup, crew and the final hour.', photos: slots(8, []) }
];

const Gallery = (function () {
  const root = $('#gallery-root');
  let items = [], idx = 0;
  const ph = n => '<div class="ph">' + ICON_IMG + '<span>Photo slot ' + String(n).padStart(2, '0') + '</span></div>';
  function home() {
    root.innerHTML = '<div class="albums">' + ALBUMS.map(a => {
      const real = a.photos.filter(Boolean);
      return '<button class="album" type="button" data-album="' + a.id + '"><div class="cover">' +
        (real[0] ? '<img src="' + esc(real[0].src) + '" alt="' + esc(real[0].alt) + '" loading="lazy">' : '<div class="ph">' + ICON_IMG + '<span>Album cover</span></div>') +
        '</div><div><h3>' + esc(a.title) + '</h3><p>' + esc(a.blurb) + ' ' + (real.length ? real.length + (real.length === 1 ? ' photo.' : ' photos.') : 'Photos coming soon.') + '</p></div></button>';
    }).join('') + '</div>';
    $$('.album', root).forEach(b => b.addEventListener('click', () => open(b.dataset.album)));
  }
  function open(id) {
    const a = ALBUMS.find(x => x.id === id);
    root.innerHTML = '<button class="btn small back" type="button" id="g-back">&lsaquo; All albums</button><div class="sec-head"><h2 class="h2">' + esc(a.title) + '</h2><p class="muted">' + esc(a.blurb) + '</p></div>' +
      '<div class="thumbs">' + a.photos.map((p, i) => p
        ? '<button class="thumb" type="button" data-i="' + i + '"><img src="' + esc(p.src) + '" alt="' + esc(p.alt) + '" loading="lazy"></button>'
        : ph(i + 1)).join('') + '</div>';
    $('#g-back').addEventListener('click', () => { home(); window.scrollTo(0, 0); });
    items = a.photos.filter(Boolean);
    $$('.thumb', root).forEach(t => t.addEventListener('click', () => {
      const p = a.photos[+t.dataset.i]; show(items.indexOf(p));
    }));
    window.scrollTo(0, 0);
  }
  const lb = $('#lb');
  function show(i) {
    idx = (i + items.length) % items.length;
    const p = items[idx];
    $('#lb-img').src = p.src; $('#lb-img').alt = p.alt;
    $('#lb-cap').textContent = (idx + 1) + ' / ' + items.length;
    lb.hidden = false; $('#lb-x').focus();
  }
  function close() { lb.hidden = true; }
  $('#lb-x').addEventListener('click', close);
  $('#lb-prev').addEventListener('click', () => show(idx - 1));
  $('#lb-next').addEventListener('click', () => show(idx + 1));
  lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('lb-stage')) close(); });
  document.addEventListener('keydown', e => {
    if (lb.hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(idx - 1);
    if (e.key === 'ArrowRight') show(idx + 1);
  });
  home();
})();
</script>
</body>
</html>
